<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blueBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#eaf1fb"/>
      <stop offset="55%" stop-color="#b9cdea"/>
      <stop offset="100%" stop-color="#93b3dd"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d98a"/>
      <stop offset="50%" stop-color="#d9a02a"/>
      <stop offset="100%" stop-color="#b9791a"/>
    </linearGradient>
    <linearGradient id="banner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3c765"/>
      <stop offset="100%" stop-color="#d99a1f"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c8f3f"/>
      <stop offset="100%" stop-color="#2f6b26"/>
    </linearGradient>
    <path id="topArc" d="M 133 300 A 167 167 0 0 1 467 300"/>
    <path id="bottomArc" d="M 186 300 A 114 114 0 0 0 414 300"/>
  </defs>

  <!-- background square -->
  <rect x="4" y="4" width="592" height="592" rx="18" fill="url(#blueBg)" stroke="#39527d" stroke-width="4"/>

  <!-- laurel wreaths -->
  <g fill="url(#leaf)" stroke="#1f4a1a" stroke-width="1">
    <!-- left wreath: series of leaf shapes along a curve -->
    <g id="leftWreath">
      <ellipse cx="120" cy="180" rx="16" ry="8" transform="rotate(-70 120 180)"/>
      <ellipse cx="100" cy="220" rx="18" ry="8" transform="rotate(-55 100 220)"/>
      <ellipse cx="85" cy="265" rx="19" ry="9" transform="rotate(-35 85 265)"/>
      <ellipse cx="76" cy="315" rx="20" ry="9" transform="rotate(-15 76 315)"/>
      <ellipse cx="74" cy="365" rx="20" ry="9" transform="rotate(5 74 365)"/>
      <ellipse cx="80" cy="415" rx="19" ry="9" transform="rotate(25 80 415)"/>
      <ellipse cx="95" cy="460" rx="18" ry="8" transform="rotate(45 95 460)"/>
      <ellipse cx="118" cy="498" rx="17" ry="8" transform="rotate(62 118 498)"/>
      <ellipse cx="148" cy="528" rx="16" ry="8" transform="rotate(78 148 528)"/>
    </g>
    <!-- right wreath mirrored -->
    <g id="rightWreath" transform="translate(600,0) scale(-1,1)">
      <ellipse cx="120" cy="180" rx="16" ry="8" transform="rotate(-70 120 180)"/>
      <ellipse cx="100" cy="220" rx="18" ry="8" transform="rotate(-55 100 220)"/>
      <ellipse cx="85" cy="265" rx="19" ry="9" transform="rotate(-35 85 265)"/>
      <ellipse cx="76" cy="315" rx="20" ry="9" transform="rotate(-15 76 315)"/>
      <ellipse cx="74" cy="365" rx="20" ry="9" transform="rotate(5 74 365)"/>
      <ellipse cx="80" cy="415" rx="19" ry="9" transform="rotate(25 80 415)"/>
      <ellipse cx="95" cy="460" rx="18" ry="8" transform="rotate(45 95 460)"/>
      <ellipse cx="118" cy="498" rx="17" ry="8" transform="rotate(62 118 498)"/>
      <ellipse cx="148" cy="528" rx="16" ry="8" transform="rotate(78 148 528)"/>
    </g>
  </g>

  <!-- outer gold ring -->
  <circle cx="300" cy="300" r="172" fill="url(#goldRing)" stroke="#8a5c10" stroke-width="3"/>
  <circle cx="300" cy="300" r="150" fill="#fdf6e3" stroke="#8a5c10" stroke-width="2"/>

  <!-- inner white circle -->
  <circle cx="300" cy="300" r="112" fill="#ffffff" stroke="#c99a3a" stroke-width="3"/>

  <!-- curved top text -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="bold" fill="#173a63" letter-spacing="0.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">AL-MAWRID ISLAMIC INTERNATIONAL COLLEGE</textPath>
  </text>

  <!-- curved bottom text -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="bold" fill="#173a63" letter-spacing="1.2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">ILORIN KWARA STATE</textPath>
  </text>

  <!-- center emblem: open book -->
  <g transform="translate(300,300)">
    <path d="M -55 -8 Q -30 -22 0 -8 Q 30 -22 55 -8 L 55 28 Q 30 14 0 28 Q -30 14 -55 28 Z"
          fill="#f7f7f7" stroke="#173a63" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-8" x2="0" y2="28" stroke="#173a63" stroke-width="2.5"/>
    <line x1="-40" y1="-3" x2="-10" y2="-9" stroke="#9aa7bb" stroke-width="1.3"/>
    <line x1="-40" y1="4" x2="-10" y2="-2" stroke="#9aa7bb" stroke-width="1.3"/>
    <line x1="-40" y1="11" x2="-10" y2="5" stroke="#9aa7bb" stroke-width="1.3"/>
    <line x1="40" y1="-3" x2="10" y2="-9" stroke="#9aa7bb" stroke-width="1.3"/>
    <line x1="40" y1="4" x2="10" y2="-2" stroke="#9aa7bb" stroke-width="1.3"/>
    <line x1="40" y1="11" x2="10" y2="5" stroke="#9aa7bb" stroke-width="1.3"/>
    <text x="0" y="55" font-family="Georgia, serif" font-size="14" fill="#173a63" text-anchor="middle" font-weight="bold">Est. 2013</text>
  </g>

  <!-- decorative small stars either side of book -->
  <g fill="#c99a3a">
    <circle cx="220" cy="300" r="2.5"/>
    <circle cx="380" cy="300" r="2.5"/>
  </g>

  <!-- ribbon banner -->
  <g>
    <path d="M 150 470 L 450 470 L 470 500 L 430 500 L 430 530 L 170 530 L 170 500 L 130 500 Z"
          fill="url(#banner)" stroke="#8a5c10" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 130 500 L 100 520 L 150 512 Z" fill="#b9791a" stroke="#8a5c10" stroke-width="1.5"/>
    <path d="M 470 500 L 500 520 L 450 512 Z" fill="#b9791a" stroke="#8a5c10" stroke-width="1.5"/>
    <text x="300" y="507" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#173a63" text-anchor="middle">Motto: KNOWLEDGE AND FAITH</text>
  </g>

  <!-- bottom wave / chevrons -->
  <g fill="none" stroke-width="10" stroke-linecap="round">
    <path d="M 60 570 Q 300 610 540 570" stroke="#1f7a5c"/>
    <path d="M 90 585 Q 300 620 510 585" stroke="#16523d"/>
  </g>
</svg>
